name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs that may publish are not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/yoonaowo/llm-proxy-frontend
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Generated API types match api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code

  # Pull requests: build every platform, never log in, never push.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: llm-proxy-frontend:ci
          cache-from: type=gha
      - name: Serves the build and reports healthy
        run: |
          docker run -d --name frontend -p 127.0.0.1:8080:8080 -e BACKEND_ORIGIN=http://127.0.0.1:9 llm-proxy-frontend:ci
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' frontend || echo gone)
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] || { docker logs frontend; exit 1; }
      - name: Headers (CSP, security, caching)
        run: nginx/check-headers.sh http://127.0.0.1:8080
      - name: Container log on failure
        if: failure()
        run: docker logs frontend || true

  # Pushes to main publish `edge` and `sha-<short>`; version tags vX.Y.Z publish
  # X.Y.Z, X.Y, X (from 1.0 on) and latest. Then every platform of the pushed
  # manifest is started and checked.
  publish:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: dockerhub
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # auto: `latest` only with a stable semver tag, never from a branch.
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=llm-proxy-frontend
            org.opencontainers.image.description=Web interface of llm-proxy: user cabinet and admin panel, served by unprivileged nginx.
            org.opencontainers.image.licenses=MIT
      - id: version
        name: Compute UI version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Each platform runs by its own manifest digest from the pushed index: the
      # engine's image store keeps one image per digest reference, so running the
      # index digest a second time for another platform fails.
      - name: Every platform starts and serves /healthz
        env:
          INDEX: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          manifests="$(docker buildx imagetools inspect "$INDEX" --format '{{json .Manifest}}')"
          for platform in ${PLATFORMS//,/ }; do
            digest="$(jq -r --arg os "${platform%/*}" --arg arch "${platform#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<<"$manifests")"
            [ -n "$digest" ] || { echo "$platform: not in $INDEX" >&2; exit 1; }
            name="smoke-${platform//\//-}"
            echo "$platform: $IMAGE@$digest"
            docker run -d --name "$name" --platform "$platform" -e BACKEND_ORIGIN=http://127.0.0.1:9 "$IMAGE@$digest"
            ok=
            for _ in $(seq 60); do
              if docker exec "$name" wget -qO- http://127.0.0.1:8080/healthz; then ok=1; break; fi
              sleep 2
            done
            arch="$(docker exec "$name" uname -m || true)"
            echo " $platform: machine $arch"
            if [ -z "$ok" ]; then docker logs "$name"; exit 1; fi
            case "$platform:$arch" in
              linux/amd64:x86_64 | linux/arm64:aarch64) ;;
              *) echo "$platform ran as $arch" >&2; exit 1 ;;
            esac
            if [ "$platform" = linux/amd64 ]; then echo "AMD64_REF=$IMAGE@$digest" >>"$GITHUB_ENV"; fi
            docker rm -f "$name"
          done
      - name: Headers of the pushed amd64 image
        run: |
          docker run -d --name frontend --platform linux/amd64 -p 127.0.0.1:8080:8080 -e BACKEND_ORIGIN=http://127.0.0.1:9 "$AMD64_REF"
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' frontend || echo gone)
            [ "$status" = healthy ] && break
            sleep 1
          done
          [ "$status" = healthy ] || { docker logs frontend; exit 1; }
          nginx/check-headers.sh http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: |
          for c in smoke-linux-amd64 smoke-linux-arm64 frontend; do docker logs "$c" 2>&1 || true; done
